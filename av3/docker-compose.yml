version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: greencode-postgres-av3
    restart: always
    environment:
      POSTGRES_USER: greencode
      POSTGRES_PASSWORD: greencode_secret
      POSTGRES_DB: greencode_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata_av3:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U greencode -d greencode_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: greencode-redis-av3
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redisdata_av3:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata_av3:
  redisdata_av3:
